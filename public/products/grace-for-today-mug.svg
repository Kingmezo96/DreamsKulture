<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 800 1000" role="img" aria-label="GRACE FOR TODAY">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f9f6ef"/>
        <stop offset="1" stop-color="#e7ded2"/>
      </linearGradient>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#000" flood-opacity=".18"/>
      </filter>
      <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.4" fill="#111" opacity=".12"/>
      </pattern>
    </defs>
    <rect width="800" height="1000" fill="url(#bg)"/>
    <rect x="42" y="42" width="716" height="916" fill="url(#dots)" opacity=".65"/>
    <text x="82" y="890" fill="#111" opacity=".18" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="10" transform="rotate(-90 82 890)">DREAMS KULTURE</text>
    
      <rect x="245" y="220" width="270" height="360" rx="38" fill="#fafafa" filter="url(#softShadow)"/>
      <path d="M512 310 H572 C650 310 650 490 572 490 H512" fill="none" stroke="#fafafa" stroke-width="45" stroke-linecap="round"/>
      <ellipse cx="380" cy="221" rx="122" ry="30" fill="#fff" opacity=".65"/>
    
    
    <g text-anchor="middle">
      <text x="400" y="316" fill="#c0392b" font-family="Georgia, serif" font-size="38" font-style="italic" font-weight="700">GRACE</text>
      <text x="400" y="368" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="900" letter-spacing="3">FOR TODAY</text>
      <line x1="315" y1="396" x2="485" y2="396" stroke="#c0392b" stroke-width="3" opacity=".8"/>
      <text x="400" y="430" fill="#111827" opacity=".9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LAMENTATIONS 3:23</text>
    </g>
  
    <text x="400" y="910" text-anchor="middle" fill="#111" opacity=".5" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="7">FAITH-BASED ESSENTIALS</text>
  </svg>