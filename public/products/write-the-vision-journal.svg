<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 800 1000" role="img" aria-label="WRITE THE VISION">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f9f6ef"/>
        <stop offset="1" stop-color="#e7ded2"/>
      </linearGradient>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#000" flood-opacity=".18"/>
      </filter>
      <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.4" fill="#111" opacity=".12"/>
      </pattern>
    </defs>
    <rect width="800" height="1000" fill="url(#bg)"/>
    <rect x="42" y="42" width="716" height="916" fill="url(#dots)" opacity=".65"/>
    <text x="82" y="890" fill="#111" opacity=".18" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="10" transform="rotate(-90 82 890)">DREAMS KULTURE</text>
    
      <rect x="240" y="155" width="310" height="505" rx="20" fill="#6e1f35" filter="url(#softShadow)"/>
      <path d="M286 155 V660" stroke="rgba(255,255,255,.18)" stroke-width="5"/>
      <path d="M525 185 V630" stroke="#e8d7bd" stroke-width="2" opacity=".65"/>
    
    
    <g text-anchor="middle">
      <text x="400" y="278" fill="#e8d7bd" font-family="Georgia, serif" font-size="38" font-style="italic" font-weight="700">WRITE</text>
      <text x="400" y="330" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="900" letter-spacing="3">THE VISION</text>
      <line x1="315" y1="358" x2="485" y2="358" stroke="#e8d7bd" stroke-width="3" opacity=".8"/>
      <text x="400" y="392" fill="#ffffff" opacity=".9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">HABAKKUK 2:2</text>
    </g>
  
    <text x="400" y="910" text-anchor="middle" fill="#111" opacity=".5" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="7">FAITH-BASED ESSENTIALS</text>
  </svg>