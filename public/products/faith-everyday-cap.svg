      <path d="M222 398 Q260 272 397 272 Q534 272 574 398 Q481 434 397 434 Q313 434 222 398 Z" fill="#111111" filter="url(#softShadow)"/>
      <path d="M306 418 Q430 388 626 452 Q489 493 332 467 Q250 453 186 421 Q234 405 306 418 Z" fill="#111111"/>
    
    
    <g text-anchor="middle">
      <text x="400" y="326" fill="#6b7f45" font-family="Georgia, serif" font-size="38" font-style="italic" font-weight="700">FAITH</text>
      <text x="400" y="378" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="900" letter-spacing="3">EVERYDAY</text>
